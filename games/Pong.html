        // virtual:/main.js
kaplay({
  background: [255, 255, 128]
});
var paddle1 = add([
  pos(40, center().y),
  rect(20, 80),
  outline(4),
  anchor("center"),
  area({ isSensor: true }),
  "paddle",
  "paddle1"
]);
var paddle2 = add([
  pos(width() - 40, center().y),
  rect(20, 80),
  outline(4),
  anchor("center"),
  area({ isSensor: true }),
  "paddle",
  "paddle2"
]);
var SPEED = 400;
onKeyDown("w", () => paddle1.move(0, -SPEED));
onKeyDown("s", () => paddle1.move(0, SPEED));
onKeyDown("up", () => paddle2.move(0, -SPEED));
onKeyDown("down", () => paddle2.move(0, SPEED));
var score = 0;
add([
  text(score.toString()),
  pos(center()),
  anchor("center"),
  z(50),
  {
    update() {
      this.text = score.toString();
    }
  }
]);
var speed = 480;
var ball = add([
  pos(center()),
  circle(16),
  outline(4),
  area(),
  {
    vel: Vec2.fromAngle(rand(-1, 1))
  }
]);
ball.onUpdate(() => {
  ball.move(ball.vel.scale(speed));
  if (ball.pos.x < 0 || ball.pos.x > width()) {
    score = 0;
    ball.pos = center();
    ball.vel = Vec2.fromAngle(rand(-20, 20));
    speed = 320;
  }
  if (ball.pos.y < 0 || ball.pos.y > height()) {
    ball.vel.y = -ball.vel.y;
  }
});
ball.onCollide("paddle", (p) => {
  speed += 20;
  ball.vel.x *= -1;
  const diff = ball.pos.y - p.pos.y;
  ball.vel.y = diff * 0.02;
});

    </script>
